<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEYFORGE 14 — Noir Gold Musical Keyboard Game</title>
  <style>
    :root {
      --bg-void: #050608;
      --panel-bg: rgba(9, 10, 14, 0.82);
      --panel-border: rgba(218, 177, 86, 0.24);
      --text-primary: #f6f2e9;
      --text-muted: #8b867b;
      --gold: #eab64d;
      --gold-light: #fae09e;
      --cyan: #22d3ee;
      --emerald: #10b981;
      --violet: #c084fc;
      --rose: #fb7185;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Aurum Overdrive Edge Vignette */
    #overdrive-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      box-shadow:
        inset 0 0 110px rgba(234, 182, 77, 0.34),
        inset 0 0 42px rgba(34, 211, 238, 0.22);
      transition: opacity 0.35s ease;
    }
    #overdrive-vignette.active { opacity: 1; }

    .glass-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.70),
        inset 0 1px 0 rgba(250, 224, 158, 0.10);
      border-radius: 14px;
      pointer-events: auto;
    }

    .hud-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* =======================================================================
       TOP-LEFT: Brand, 3-Mode Gameplay Switcher & Build Progress
       ======================================================================= */
    #hud-left {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 12px 15px;
      min-width: 268px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(120deg, #fff6db 0%, #eab64d 55%, #c58f2b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fef08a, #d99a26);
      box-shadow: 0 0 12px rgba(234, 182, 77, 0.9);
      flex-shrink: 0;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rank-pill {
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(234, 182, 77, 0.24), rgba(184, 132, 36, 0.16));
      border: 1px solid rgba(250, 224, 158, 0.45);
      color: var(--gold-light);
    }

    .counter-pill {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #d6cfc2;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.11);
      padding: 2px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* 3-Mode Gameplay Switcher */
    .mode-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(218, 177, 86, 0.14);
    }

    .mode-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(234, 182, 77, 0.30), rgba(184, 132, 36, 0.20));
      color: #fff8e7;
      box-shadow: inset 0 0 0 1px rgba(250, 224, 158, 0.48), 0 2px 12px rgba(234, 182, 77, 0.20);
    }

    .mode-btn:hover:not(.active) {
      color: #e2dcd0;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #b88424, #eab64d, #22d3ee, #c084fc);
      box-shadow: 0 0 12px rgba(234, 182, 77, 0.55);
      transition: width 0.28s ease;
    }

    .hud-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .meta-highlight {
      color: var(--gold);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* =======================================================================
       TOP-CENTER: Live Gameplay Score, Combo, Aurum Fever & Audio Visualizer
       ======================================================================= */
    #hud-center {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.16s ease;
    }

    #hud-center.overdrive {
      border-color: rgba(250, 224, 158, 0.72);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.72), 0 0 28px rgba(234, 182, 77, 0.34);
    }

    #hud-center.shake {
      animation: hudShake 0.30s ease;
      border-color: rgba(251, 113, 133, 0.7);
    }

    @keyframes hudShake {
      0%, 100% { transform: translateX(-50%); }
      25% { transform: translateX(calc(-50% - 6px)); }
      55% { transform: translateX(calc(-50% + 6px)); }
    }

    .stat-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 62px;
    }

    .stat-lbl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1px;
    }

    .stat-num {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff8e7;
      line-height: 1.1;
    }

    .stat-num.gold-num {
      min-width: 84px;
      text-align: center;
      background: linear-gradient(180deg, #fff9e6 0%, #eab64d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-sep {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.09);
    }

    .combo-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      transition: transform 0.12s cubic-bezier(0.22, 1.5, 0.36, 1);
    }

    .combo-row.pop { transform: scale(1.22); }

    .mult-chip {
      font-size: 10.5px;
      font-weight: 800;
      padding: 1.5px 6px;
      border-radius: 6px;
      background: rgba(234, 182, 77, 0.16);
      border: 1px solid rgba(234, 182, 77, 0.42);
      color: var(--gold-light);
    }

    .mult-chip.overdrive {
      background: rgba(34, 211, 238, 0.24);
      border-color: rgba(34, 211, 238, 0.72);
      color: #e0f2fe;
    }

    .fever-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 98px;
    }

    .fever-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .fever-head .hot {
      color: var(--gold-light);
      text-shadow: 0 0 8px rgba(234, 182, 77, 0.9);
    }

    .fever-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .fever-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #eab64d, #22d3ee);
      transition: width 0.18s ease;
    }

    .fever-fill.overdrive {
      background: linear-gradient(90deg, #eab64d, #00f5d4, #c084fc, #fb923c, #eab64d);
      background-size: 220% 100%;
      animation: auroraFlow 1.1s linear infinite;
    }

    @keyframes auroraFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }

    .note-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 2px;
    }

    .el-orb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    .note-text {
      display: flex;
      flex-direction: column;
      min-width: 86px;
    }

    .note-key-line {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff8e7;
      white-space: nowrap;
    }

    .note-voice-line {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--gold);
      white-space: nowrap;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 16px;
    }

    .eq-bar {
      width: 2.5px;
      height: 3px;
      border-radius: 2px;
      background: var(--gold);
      transition: height 0.11s ease, background 0.2s ease;
    }

    /* =======================================================================
       TOP-RIGHT: Clean Noir-Gold Controls
       ======================================================================= */
    #hud-right {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      appearance: none;
      border: 1px solid rgba(218, 177, 86, 0.20);
      background: rgba(255, 255, 255, 0.035);
      color: #ded8cb;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 7px 11px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: rgba(234, 182, 77, 0.15);
      border-color: rgba(234, 182, 77, 0.54);
      color: #fff8e7;
      box-shadow: 0 0 16px rgba(234, 182, 77, 0.15);
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, rgba(234, 182, 77, 0.26), rgba(184, 132, 36, 0.18));
      border-color: rgba(234, 182, 77, 0.50);
      color: var(--gold-light);
    }

    .ctrl-btn.danger:hover:not(:disabled) {
      background: rgba(251, 113, 133, 0.16);
      border-color: rgba(251, 113, 133, 0.52);
      color: #ffe4e6;
    }

    .ctrl-btn:active:not(:disabled) { transform: scale(0.96); }
    .ctrl-btn:disabled { opacity: 0.32; cursor: default; }
    .ctrl-btn.muted { opacity: 0.58; color: var(--text-muted); }

    /* =======================================================================
       BOTTOM PLAYABLE QUEUE / WORD RIBBON (Shown in Melody Rush & Word Forge!)
       ======================================================================= */
    #game-ribbon {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    #game-ribbon.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .ribbon-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(234, 182, 77, 0.12);
      border: 1px solid rgba(234, 182, 77, 0.32);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .ribbon-keys {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .r-tile {
      min-width: 30px;
      height: 30px;
      padding: 0 8px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #8f8a7f;
      transition: all 0.16s ease;
    }

    .r-tile.done {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .r-tile.current {
      background: linear-gradient(135deg, rgba(234, 182, 77, 0.34), rgba(250, 224, 158, 0.18));
      border-color: #fae09e;
      color: #fffef5;
      transform: scale(1.14);
      box-shadow: 0 0 18px rgba(234, 182, 77, 0.55);
    }

    .ribbon-stat {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .ribbon-next-btn {
      appearance: none;
      border: 1px solid rgba(234, 182, 77, 0.30);
      background: rgba(234, 182, 77, 0.10);
      color: var(--gold-light);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 9px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ribbon-next-btn:hover {
      background: rgba(234, 182, 77, 0.24);
    }

    /* Bottom-Center: Interactive Key Elements & Instruments Legend */
    #elements-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #9e988c;
      white-space: nowrap;
    }

    .el-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .el-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
    }

    /* Projected 3D Floating Judgements & Note Tags */
    #float-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
    }

    .float-tag {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.96);
      animation: tagRise 0.92s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .float-grade {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .float-sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    @keyframes tagRise {
      0%   { opacity: 0; transform: translate(-50%, -20%) scale(0.74); }
      20%  { opacity: 1; transform: translate(-50%, -68%) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -160%) scale(0.95); }
    }

    /* Toast */
    #key-toast {
      position: fixed;
      bottom: 112px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 16;
      padding: 6px 15px;
      border-radius: 999px;
      background: rgba(10, 11, 15, 0.90);
      border: 1px solid rgba(234, 182, 77, 0.38);
      backdrop-filter: blur(12px);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--gold-light);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    #key-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1050px) {
      #elements-bar { display: none; }
      .note-mini { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="overdrive-vignette"></div>
  <div id="float-layer"></div>

  <div class="hud-layer">
    <!-- Top-Left: Brand, Rank, 3-Mode Gameplay Switcher & Progress -->
    <div id="hud-left" class="glass-panel">
      <div class="brand-row">
        <div class="brand-title"><span class="brand-dot"></span>Keyforge 14</div>
        <div class="badge-group">
          <span class="rank-pill" id="rank-pill">RANK C</span>
          <span class="counter-pill" id="counter">0 / 84</span>
        </div>
      </div>

      <div class="mode-switch">
        <button class="mode-btn active" id="mode-melody">♪ Melody</button>
        <button class="mode-btn" id="mode-word">⚡ Words</button>
        <button class="mode-btn" id="mode-zen">✦ Zen</button>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
      <div class="hud-meta-row">
        <span id="hud-mode-tip">Hit the glowing golden key in rhythm</span>
        <span class="meta-highlight" id="best-label">BEST 0</span>
      </div>
    </div>

    <!-- Top-Center: Score, Combo, Aurum Overdrive & Live Synth Equalizer -->
    <div id="hud-center" class="glass-panel">
      <div class="stat-col">
        <span class="stat-lbl">Score</span>
        <span class="stat-num gold-num" id="score-val">0</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-col">
        <span class="stat-lbl">Combo</span>
        <div class="combo-row" id="combo-row">
          <span class="stat-num" id="combo-val">0</span>
          <span class="mult-chip" id="mult-chip">×1</span>
        </div>
      </div>
      <div class="stat-sep"></div>
      <div class="fever-col">
        <div class="fever-head">
          <span id="fever-lbl">Fever</span>
          <span id="fever-pct">0%</span>
        </div>
        <div class="fever-track">
          <div class="fever-fill" id="fever-fill"></div>
        </div>
      </div>
      <div class="stat-sep"></div>
      <div class="note-mini">
        <span class="el-orb" id="el-orb"></span>
        <div class="note-text">
          <span class="note-key-line" id="el-key">READY</span>
          <span class="note-voice-line" id="el-sound">84-Key Synth</span>
        </div>
        <div class="eq-bars" id="eq-bars">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </div>
      </div>
    </div>

    <!-- Top-Right: Quick Actions -->
    <div id="hud-right" class="glass-panel">
      <button class="ctrl-btn primary" id="cascade-btn" title="Assemble all remaining keys in a symphony wave">✦ Assemble</button>
      <button class="ctrl-btn" id="sound-btn" title="Toggle Audio">🔊 Music</button>
      <button class="ctrl-btn" id="view-btn" title="Reset Camera Angle">◎ View</button>
      <button class="ctrl-btn danger" id="reset-btn" disabled title="Return all keys to cases (or press Esc)">↺ Reset</button>
    </div>

    <!-- Bottom Interactive Gameplay Ribbon (Active in Melody Rush & Word Forge) -->
    <div id="game-ribbon" class="glass-panel visible">
      <span class="ribbon-tag" id="ribbon-tag">♪ NOIR ARPEGGIO</span>
      <div class="ribbon-keys" id="ribbon-keys"></div>
      <span class="ribbon-stat" id="ribbon-stat">ACC 100%</span>
      <button class="ribbon-next-btn" id="ribbon-next-btn" title="Next Song / Word">Next ↻</button>
    </div>

    <!-- Bottom Legend -->
    <div id="elements-bar" class="glass-panel">
      <span class="el-chip"><span class="el-dot" style="background:#00f5d4;box-shadow:0 0 8px #00f5d4"></span>QWERTY Harp</span>
      <span class="el-chip"><span class="el-dot" style="background:#38bdf8;box-shadow:0 0 8px #38bdf8"></span>1–0 Marimba</span>
      <span class="el-chip"><span class="el-dot" style="background:#c084fc;box-shadow:0 0 8px #c084fc"></span>F1–F12 Chords</span>
      <span class="el-chip"><span class="el-dot" style="background:#10b981;box-shadow:0 0 8px #10b981"></span>Arrows Arp</span>
      <span class="el-chip"><span class="el-dot" style="background:#eab64d;box-shadow:0 0 8px #eab64d"></span>Space Bass</span>
      <span class="el-chip"><span class="el-dot" style="background:#fb923c;box-shadow:0 0 8px #fb923c"></span>Enter Strum</span>
      <span class="el-chip"><span class="el-dot" style="background:#f43f5e;box-shadow:0 0 8px #f43f5e"></span>Mods Drums</span>
    </div>
  </div>

  <div id="key-toast"></div>

  <!-- Three.js r128 & GSAP via cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
  (() => {
    'use strict';

    // =========================================================================
    // 1. CONSTANTS & EXACT HP PAVILION 14 SERIES 84-KEY LAYOUT (1 unit = 10 mm)
    // =========================================================================
    const PITCH = 1.905;
    const KEY_GAP = 0.14;
    const KEY_H = 0.86;
    const KEY_TRAVEL = 0.40;
    const TILT_DEG = 6;
    const TILT_RAD = THREE.MathUtils.degToRad(TILT_DEG);
    const RACK_TILT_RAD = THREE.MathUtils.degToRad(24);
    const LID_OPEN_ANGLE = -THREE.MathUtils.degToRad(110);

    const GRID_UNITS_W = 16.0;
    const GRID_CENTER_X = GRID_UNITS_W * 0.5;
    const GRID_MIN_Z = -0.38;
    const GRID_MAX_Z = 5.44;
    const GRID_CENTER_Z = (GRID_MIN_Z + GRID_MAX_Z) * 0.5;
    const GRID_UNITS_D = GRID_MAX_Z - GRID_MIN_Z;

    const CASE_X_SCALE = 1.15;
    const CASE_ROW_STEP = 2.86;
    const CASE_PAD = 0.22;
    const CASE_H = 1.22;
    const CASE_BASE_T = 0.12;

    const ELEMENT_META = {
      alpha:  { name: 'Aurora Ripple',     hex: 0x00f5d4, css: '#00f5d4' },
      number: { name: 'Dual Shockwave',    hex: 0x38bdf8, css: '#38bdf8' },
      fn:     { name: 'Crown Chord',       hex: 0xc084fc, css: '#c084fc' },
      arrow:  { name: 'Laser Stream',      hex: 0x10b981, css: '#10b981' },
      space:  { name: 'Horizon Bass',      hex: 0xeab64d, css: '#eab64d' },
      enter:  { name: 'Solar Strum',       hex: 0xfb923c, css: '#fb923c' },
      esc:    { name: 'Crimson Recall',    hex: 0xfb7185, css: '#fb7185' },
      nav:    { name: 'Crystal Chime',     hex: 0x2dd4bf, css: '#2dd4bf' },
      mod:    { name: 'Studio Drum',       hex: 0xf43f5e, css: '#f43f5e' },
      punct:  { name: 'Music Box',         hex: 0xfbbf24, css: '#fbbf24' }
    };

    function buildHpPavilion14Layout() {
      const keys = [];
      const add = (label, code, kx, ky, row, kw = 1, kh = 1, group = 'alpha', sub = '', dir = null, halfSlot = 0) => {
        const gapD = kh < 0.6 ? 0.08 : KEY_GAP;
        keys.push({
          index: keys.length,
          label,
          sub,
          code,
          kx,
          ky,
          row,
          kw,
          kh,
          group,
          dir,
          halfSlot,
          cx: kx + kw * 0.5,
          cz: ky,
          keyW: kw * PITCH - KEY_GAP,
          keyD: kh * PITCH - gapD,
          state: 'stored',
          lidAngle: 0,
          caseLiftY: 0.85,
          caseHover: 0,
          targetGlow: 0,
          targetColorHex: 0xeab64d,
          activeTl: null,
          introTl: null,
          pressTl: null,
          animMesh: null,
          pressY: 0
        });
      };

      // Row 0: Compact Function Row (16 keys, F1–F10 directly over 1–0)
      add('ESC', 'Escape', 0, 0.0, 0, 1, 0.76, 'esc');
      for (let i = 1; i <= 12; i++) add('F' + i, 'F' + i, i, 0.0, 0, 1, 0.76, 'fn');
      add('PRTSC', 'PrintScreen', 13, 0.0, 0, 1, 0.76, 'nav');
      add('INS', 'Insert', 14, 0.0, 0, 1, 0.76, 'nav');
      add('DEL', 'Delete', 15, 0.0, 0, 1, 0.76, 'nav');

      // Row 1: Number Row directly under F-keys + Backspace + Home (15 keys)
      const numDefs = [
        ['`', '~', 'Backquote', 'punct'],
        ['1', '!', 'Digit1', 'number'], ['2', '@', 'Digit2', 'number'], ['3', '#', 'Digit3', 'number'],
        ['4', '$', 'Digit4', 'number'], ['5', '%', 'Digit5', 'number'], ['6', '^', 'Digit6', 'number'],
        ['7', '&', 'Digit7', 'number'], ['8', '*', 'Digit8', 'number'], ['9', '(', 'Digit9', 'number'],
        ['0', ')', 'Digit0', 'number'], ['-', '_', 'Minus', 'punct'], ['=', '+', 'Equal', 'punct']
      ];
      numDefs.forEach((d, i) => add(d[0], d[2], i, 0.94, 1, 1, 1, d[3], d[1]));
      add('BKSP', 'Backspace', 13, 0.94, 1, 2, 1, 'mod');
      add('HOME', 'Home', 15, 0.94, 1, 1, 1, 'nav');

      // Row 2: QWERTY + PgUp (15 keys)
      add('TAB', 'Tab', 0, 1.94, 2, 1.5, 1, 'mod');
      'QWERTYUIOP'.split('').forEach((ch, i) => add(ch, 'Key' + ch, 1.5 + i, 1.94, 2, 1, 1, 'alpha'));
      add('[', 'BracketLeft', 11.5, 1.94, 2, 1, 1, 'punct', '{');
      add(']', 'BracketRight', 12.5, 1.94, 2, 1, 1, 'punct', '}');
      add('\\', 'Backslash', 13.5, 1.94, 2, 1.5, 1, 'punct', '|');
      add('PGUP', 'PageUp', 15, 1.94, 2, 1, 1, 'nav');

      // Row 3: Home Row + Enter + PgDn (14 keys)
      add('CAPS', 'CapsLock', 0, 2.94, 3, 1.75, 1, 'mod');
      'ASDFGHJKL'.split('').forEach((ch, i) => add(ch, 'Key' + ch, 1.75 + i, 2.94, 3, 1, 1, 'alpha'));
      add(';', 'Semicolon', 10.75, 2.94, 3, 1, 1, 'punct', ':');
      add("'", 'Quote', 11.75, 2.94, 3, 1, 1, 'punct', '"');
      add('ENTER', 'Enter', 12.75, 2.94, 3, 2.25, 1, 'enter');
      add('PGDN', 'PageDown', 15, 2.94, 3, 1, 1, 'nav');

      // Row 4: Shift Row + End (13 keys)
      add('SHIFT', 'ShiftLeft', 0, 3.94, 4, 2.25, 1, 'mod');
      'ZXCVBNM'.split('').forEach((ch, i) => add(ch, 'Key' + ch, 2.25 + i, 3.94, 4, 1, 1, 'alpha'));
      add(',', 'Comma', 9.25, 3.94, 4, 1, 1, 'punct', '<');
      add('.', 'Period', 10.25, 3.94, 4, 1, 1, 'punct', '>');
      add('/', 'Slash', 11.25, 3.94, 4, 1, 1, 'punct', '?');
      add('SHIFT', 'ShiftRight', 12.25, 3.94, 4, 2.75, 1, 'mod');
      add('END', 'End', 15, 3.94, 4, 1, 1, 'nav');

      // Row 5: HP Pavilion 14 Bottom Row + Stacked Half-Height Up/Down Arrows (11 keys)
      add('CTRL', 'ControlLeft', 0, 4.94, 5, 1.25, 1, 'mod');
      add('FN', 'Fn', 1.25, 4.94, 5, 1.0, 1, 'mod');
      add('WIN', 'MetaLeft', 2.25, 4.94, 5, 1.0, 1, 'mod');
      add('ALT', 'AltLeft', 3.25, 4.94, 5, 1.0, 1, 'mod');
      add('', 'Space', 4.25, 4.94, 5, 6.25, 1, 'space');
      add('ALT', 'AltRight', 10.50, 4.94, 5, 1.25, 1, 'mod');
      add('CTRL', 'ControlRight', 11.75, 4.94, 5, 1.25, 1, 'mod');
      add('◀', 'ArrowLeft', 13.0, 4.94, 5, 1, 1, 'arrow', '', [-1, 0]);
      add('▲', 'ArrowUp', 14.0, 4.695, 5, 1, 0.47, 'arrow', '', [0, -1], -1);
      add('▼', 'ArrowDown', 14.0, 5.185, 5, 1, 0.47, 'arrow', '', [0, 1], 1);
      add('▶', 'ArrowRight', 15.0, 4.94, 5, 1, 1, 'arrow', '', [1, 0]);

      return keys;
    }

    const KEYS = buildHpPavilion14Layout();
    const KEY_COUNT = KEYS.length; // 84
    const KEY_BY_CODE = new Map(KEYS.map(k => [k.code, k]));

    KEYS.forEach(k => {
      k.plateX = (k.cx - GRID_CENTER_X) * PITCH;
      k.plateZ = (k.cz - GRID_CENTER_Z) * PITCH;

      k.rackX = (k.cx - GRID_CENTER_X) * PITCH * CASE_X_SCALE;
      const baseRowZ = (k.row - 2.5) * CASE_ROW_STEP;
      if (k.halfSlot === -1) {
        k.rackZ = baseRowZ - 0.56;
        k.caseD = k.keyD + 0.14;
      } else if (k.halfSlot === 1) {
        k.rackZ = baseRowZ + 0.56;
        k.caseD = k.keyD + 0.14;
      } else {
        k.rackZ = baseRowZ;
        k.caseD = k.keyD + CASE_PAD;
      }
      k.caseW = k.keyW + CASE_PAD;
    });

    // =========================================================================
    // 2. 84-KEY MULTI-INSTRUMENT MUSICAL SYNTHESIZER + GAMEPLAY FEEDBACK SFX
    // =========================================================================
    const SoundEngine = (() => {
      let ctx = null;
      let masterOut = null;
      let wetBus = null;
      let noiseBuf = null;
      let muted = false;

      const m2f = m => 440 * Math.pow(2, (m - 69) / 12);
      const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const midiName = m => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);

      const VOICE_MAP = {};
      const qwertyMidi = [62, 64, 65, 67, 69, 72, 74, 76, 77, 79];
      'QWERTYUIOP'.split('').forEach((ch, i) => {
        const m = qwertyMidi[i];
        VOICE_MAP['Key' + ch] = { kind: 'harp', midi: m, label: `${midiName(m)} · Harp` };
      });
      const homeMidi = [57, 60, 62, 64, 65, 67, 69, 72, 74];
      'ASDFGHJKL'.split('').forEach((ch, i) => {
        const m = homeMidi[i];
        VOICE_MAP['Key' + ch] = { kind: 'rhodes', midi: m, label: `${midiName(m)} · Rhodes` };
      });
      const bassMidi = [38, 41, 43, 45, 48, 50, 53];
      'ZXCVBNM'.split('').forEach((ch, i) => {
        const m = bassMidi[i];
        VOICE_MAP['Key' + ch] = { kind: 'bass', midi: m, label: `${midiName(m)} · Bass` };
      });
      const numMidi = [69, 72, 74, 76, 77, 79, 81, 84, 86, 88];
      ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0'].forEach((c, i) => {
        const m = numMidi[i];
        VOICE_MAP[c] = { kind: 'marimba', midi: m, label: `${midiName(m)} · Marimba` };
      });
      const fChords = [
        { name: 'Dm9', notes: [50, 57, 60, 64] }, { name: 'Fmaj7', notes: [53, 60, 64, 69] },
        { name: 'Gm9', notes: [55, 62, 65, 69] }, { name: 'Am7', notes: [57, 64, 67, 72] },
        { name: 'Bbmaj7', notes: [58, 62, 65, 69] }, { name: 'C6/9', notes: [60, 64, 67, 74] },
        { name: 'Dm11', notes: [50, 57, 65, 67] }, { name: 'Em7b5', notes: [52, 58, 62, 67] },
        { name: 'F6/9', notes: [53, 62, 64, 69] }, { name: 'G9sus', notes: [55, 60, 62, 69] },
        { name: 'Am9', notes: [57, 64, 67, 71] }, { name: 'Dmaj9', notes: [50, 57, 61, 64] }
      ];
      fChords.forEach((ch, i) => {
        VOICE_MAP['F' + (i + 1)] = { kind: 'chord', notes: ch.notes, label: `${ch.name} · Pad` };
      });

      VOICE_MAP['ArrowUp']    = { kind: 'arp', notes: [62, 69, 74, 76], label: 'Rise · Arp' };
      VOICE_MAP['ArrowDown']  = { kind: 'arp', notes: [76, 74, 69, 62], label: 'Fall · Arp' };
      VOICE_MAP['ArrowLeft']  = { kind: 'arp', notes: [72, 67, 64, 60], label: 'Drift L · Arp' };
      VOICE_MAP['ArrowRight'] = { kind: 'arp', notes: [60, 64, 67, 72], label: 'Glide R · Arp' };
      VOICE_MAP['Space']      = { kind: 'subdrop', midi: 38, notes: [50, 57, 62], label: 'D2 · Sub Boom' };
      VOICE_MAP['Enter']      = { kind: 'strum',   notes: [50, 57, 62, 64, 69, 74], label: 'Dadd9 · Strum' };
      VOICE_MAP['Escape']     = { kind: 'recall',  notes: [74, 69, 62], label: 'Recall · Bell' };

      VOICE_MAP['ControlLeft']  = { kind: 'kick',   pitch: 118,   label: 'Deep Kick' };
      VOICE_MAP['ControlRight'] = { kind: 'kick',   pitch: 96,    label: 'Sub Kick' };
      VOICE_MAP['ShiftLeft']    = { kind: 'snare',  pitch: 210,   label: 'Crisp Snare' };
      VOICE_MAP['ShiftRight']   = { kind: 'snare',  pitch: 265,   label: 'Tight Rim' };
      VOICE_MAP['AltLeft']      = { kind: 'hat',    decay: 0.045, label: 'Closed Hat' };
      VOICE_MAP['AltRight']     = { kind: 'hat',    decay: 0.16,  label: 'Open Hat' };
      VOICE_MAP['Tab']          = { kind: 'clave',  pitch: 1120,  label: 'Wood Clave' };
      VOICE_MAP['CapsLock']     = { kind: 'clave',  pitch: 860,   label: 'Studio Snap' };
      VOICE_MAP['Backspace']    = { kind: 'shaker',               label: 'Brush Sweep' };
      VOICE_MAP['Fn']           = { kind: 'bell',   midi: 84,     label: 'C6 · Gold Bell' };
      VOICE_MAP['MetaLeft']     = { kind: 'bell',   midi: 86,     label: 'D6 · Spark Bell' };

      const punctCodes = ['Backquote', 'Minus', 'Equal', 'BracketLeft', 'BracketRight', 'Backslash', 'Semicolon', 'Quote', 'Comma', 'Period', 'Slash'];
      const punctMidi  = [74, 76, 77, 79, 81, 84, 72, 74, 67, 69, 71];
      punctCodes.forEach((c, i) => { VOICE_MAP[c] = { kind: 'musicbox', midi: punctMidi[i], label: `${midiName(punctMidi[i])} · Box` }; });

      const navCodes = ['PrintScreen', 'Insert', 'Delete', 'Home', 'PageUp', 'PageDown', 'End'];
      const navMidi  = [76, 79, 81, 84, 86, 88, 72];
      navCodes.forEach((c, i) => { VOICE_MAP[c] = { kind: 'bell', midi: navMidi[i], label: `${midiName(navMidi[i])} · Chime` }; });

      function getVoice(key) {
        return VOICE_MAP[key.code] || { kind: 'harp', midi: 62 + (key.index % 12), label: 'Synth Note' };
      }

      function buildReverb(ac) {
        const rate = ac.sampleRate;
        const len = Math.floor(rate * 1.35);
        const buf = ac.createBuffer(2, len, rate);
        for (let ch = 0; ch < 2; ch++) {
          const d = buf.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8) * 0.45;
        }
        const conv = ac.createConvolver();
        conv.buffer = buf;
        const wetGain = ac.createGain();
        wetGain.gain.value = 0.28;
        conv.connect(wetGain);
        wetGain.connect(masterOut);
        return conv;
      }

      function ensureCtx() {
        if (muted) return null;
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -10; comp.knee.value = 18; comp.ratio.value = 4;
          comp.attack.value = 0.004; comp.release.value = 0.14;
          comp.connect(ctx.destination);
          masterOut = comp;
          wetBus = buildReverb(ctx);

          const len = Math.floor(ctx.sampleRate * 0.25);
          noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
          const data = noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function sendToMix(node, reverbAmount = 0.4) {
        node.connect(masterOut);
        if (reverbAmount > 0 && wetBus) {
          const s = ctx.createGain();
          s.gain.value = reverbAmount;
          node.connect(s);
          s.connect(wetBus);
        }
      }

      function playMechanicalThock(ac, key, vol, isSnap) {
        const now = ac.currentTime;
        const sizeFactor = Math.min(2.2, Math.sqrt(key.kw * Math.max(0.5, key.kh)));
        const baseFreq = (isSnap ? 165 : 192) / Math.pow(sizeFactor, 0.40);
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq * 1.4, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.42, now + 0.042);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.18 * vol, now + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.055);
        osc.connect(g); g.connect(masterOut);
        osc.start(now); osc.stop(now + 0.06);

        const nSrc = ac.createBufferSource(); nSrc.buffer = noiseBuf;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = 1480 / Math.pow(sizeFactor, 0.25); bp.Q.value = 1.7;
        const ng = ac.createGain();
        ng.gain.setValueAtTime(0.13 * vol, now);
        ng.gain.exponentialRampToValueAtTime(0.0008, now + 0.025);
        nSrc.connect(bp); bp.connect(ng); ng.connect(masterOut);
        nSrc.start(now); nSrc.stop(now + 0.032);
      }

      function playKeyMusic(key, volume = 1.0, isSnap = false) {
        const voice = getVoice(key);
        const ac = ensureCtx();
        if (!ac) return voice;
        const now = ac.currentTime;
        playMechanicalThock(ac, key, volume, isSnap);
        const v = volume;

        if (voice.kind === 'harp') {
          const f = m2f(voice.midi);
          const osc1 = ac.createOscillator(); const osc2 = ac.createOscillator();
          const filt = ac.createBiquadFilter(); const g = ac.createGain();
          osc1.type = 'triangle'; osc1.frequency.setValueAtTime(f, now);
          osc2.type = 'sine';     osc2.frequency.setValueAtTime(f * 2.0, now);
          filt.type = 'lowpass'; filt.frequency.setValueAtTime(f * 6.5, now);
          filt.frequency.exponentialRampToValueAtTime(f * 1.6, now + 0.35);
          g.gain.setValueAtTime(0.0008, now); g.gain.linearRampToValueAtTime(0.20 * v, now + 0.006);
          g.gain.exponentialRampToValueAtTime(0.0008, now + 0.68);
          const g2 = ac.createGain(); g2.gain.value = 0.28;
          osc1.connect(filt); osc2.connect(g2); g2.connect(filt); filt.connect(g);
          sendToMix(g, 0.55); osc1.start(now); osc2.start(now); osc1.stop(now + 0.72); osc2.stop(now + 0.72);
        } else if (voice.kind === 'rhodes') {
          const f = m2f(voice.midi);
          const c = ac.createOscillator(); const ti = ac.createOscillator();
          const g = ac.createGain(); const tg = ac.createGain();
          c.type = 'sine'; c.frequency.setValueAtTime(f, now);
          ti.type = 'sine'; ti.frequency.setValueAtTime(f * 3.0, now);
          tg.gain.setValueAtTime(0.08 * v, now); tg.gain.exponentialRampToValueAtTime(0.0008, now + 0.14);
          g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.23 * v, now + 0.010);
          g.gain.exponentialRampToValueAtTime(0.0008, now + 0.78);
          c.connect(g); ti.connect(tg); tg.connect(g); sendToMix(g, 0.45);
          c.start(now); ti.start(now); c.stop(now + 0.82); ti.stop(now + 0.22);
        } else if (voice.kind === 'bass') {
          const f = m2f(voice.midi);
          const osc = ac.createOscillator(); const sub = ac.createOscillator();
          const lp = ac.createBiquadFilter(); const g = ac.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(f, now);
          sub.type = 'sine'; sub.frequency.setValueAtTime(f * 0.5, now);
          lp.type = 'lowpass'; lp.Q.value = 4.2; lp.frequency.setValueAtTime(f * 7.0, now);
          lp.frequency.exponentialRampToValueAtTime(f * 1.4, now + 0.28);
          g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.22 * v, now + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0008, now + 0.52);
          const sg = ac.createGain(); sg.gain.value = 0.55;
          osc.connect(lp); sub.connect(sg); sg.connect(lp); lp.connect(g); sendToMix(g, 0.20);
          osc.start(now); sub.start(now); osc.stop(now + 0.56); sub.stop(now + 0.56);
        } else if (voice.kind === 'marimba') {
          const f = m2f(voice.midi);
          const o1 = ac.createOscillator(); const o2 = ac.createOscillator();
          const g = ac.createGain(); const g2 = ac.createGain();
          o1.type = 'sine'; o1.frequency.setValueAtTime(f, now);
          o2.type = 'sine'; o2.frequency.setValueAtTime(f * 3.98, now);
          g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.22 * v, now + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0008, now + 0.34);
          g2.gain.setValueAtTime(0.09 * v, now); g2.gain.exponentialRampToValueAtTime(0.0008, now + 0.075);
          o1.connect(g); o2.connect(g2); g2.connect(g); sendToMix(g, 0.52);
          o1.start(now); o2.start(now); o1.stop(now + 0.38); o2.stop(now + 0.12);
        } else if (voice.kind === 'chord') {
          voice.notes.forEach((m, idx) => {
            const t0 = now + idx * 0.018;
            const o = ac.createOscillator(); const lp = ac.createBiquadFilter(); const g = ac.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(m2f(m), t0);
            lp.type = 'lowpass'; lp.frequency.setValueAtTime(1900, t0);
            g.gain.setValueAtTime(0.0008, t0); g.gain.linearRampToValueAtTime(0.11 * v, t0 + 0.08);
            g.gain.exponentialRampToValueAtTime(0.0008, t0 + 1.05);
            o.connect(lp); lp.connect(g); sendToMix(g, 0.72); o.start(t0); o.stop(t0 + 1.12);
          });
        } else if (voice.kind === 'arp') {
          voice.notes.forEach((m, idx) => {
            const t0 = now + idx * 0.048;
            const o = ac.createOscillator(); const g = ac.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(m2f(m), t0);
            g.gain.setValueAtTime(0.001, t0); g.gain.linearRampToValueAtTime(0.15 * v, t0 + 0.006);
            g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.28);
            o.connect(g); sendToMix(g, 0.55); o.start(t0); o.stop(t0 + 0.32);
          });
        } else if (voice.kind === 'subdrop') {
          const sub = ac.createOscillator(); const sg = ac.createGain();
          sub.type = 'sine'; sub.frequency.setValueAtTime(110, now);
          sub.frequency.exponentialRampToValueAtTime(46, now + 0.22);
          sg.gain.setValueAtTime(0.001, now); sg.gain.linearRampToValueAtTime(0.32 * v, now + 0.008);

    function mergeGeometries(geos) {
      const nonIndexed = geos.map(g => (g.index ? g.toNonIndexed() : g));
      let totalVerts = 0;
      nonIndexed.forEach(g => { totalVerts += g.attributes.position.count; });
      const pos = new Float32Array(totalVerts * 3);
      const norm = new Float32Array(totalVerts * 3);
      const uv = new Float32Array(totalVerts * 2);
      let vOff = 0;
      nonIndexed.forEach(g => {
        const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
        pos.set(p.array, vOff * 3);
        if (n) norm.set(n.array, vOff * 3);
        if (u) uv.set(u.array, vOff * 2);
        vOff += p.count;
      });
      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      merged.setAttribute('normal', new THREE.BufferAttribute(norm, 3));
      merged.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      return merged;
    }

    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape(), hw = w * 0.5, hh = h * 0.5, cr = Math.min(r, hw, hh);
      s.moveTo(-hw + cr, -hh); s.lineTo(hw - cr, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + cr);
      s.lineTo(hw, hh - cr); s.quadraticCurveTo(hw, hh, hw - cr, hh);
      s.lineTo(-hw + cr, hh); s.quadraticCurveTo(-hw, hh, -hw, hh - cr);
      s.lineTo(-hw, -hh + cr); s.quadraticCurveTo(-hw, -hh, -hw + cr, -hh);
      return s;
    }

    function roundedRectPath(w, h, r) {
      const p = new THREE.Path(), hw = w * 0.5, hh = h * 0.5, cr = Math.min(r, hw, hh);
      p.moveTo(-hw + cr, -hh); p.lineTo(hw - cr, -hh); p.quadraticCurveTo(hw, -hh, hw, -hh + cr);
      p.lineTo(hw, hh - cr); p.quadraticCurveTo(hw, hh, hw - cr, hh);
      p.lineTo(-hw + cr, hh); p.quadraticCurveTo(-hw, hh, -hw, hh - cr);
      p.lineTo(-hw, -hh + cr); p.quadraticCurveTo(-hw, -hh, -hw + cr, -hh);

    }

    function roundSquarePoint(x, z, cornerR) {
      const ax = Math.abs(x), az = Math.abs(z), inner = 0.5 - cornerR;

        if (len > 1e-5) {
          const scale = Math.max(dx, dz) / len;
          return [Math.sign(x) * (inner + dx * scale), Math.sign(z) * (inner + dz * scale)];
        }

    const PLATE_Y = -0.56;
    const dummy = new THREE.Object3D();

    const swBottomInst = new THREE.InstancedMesh(new THREE.BoxGeometry(1.36, 0.28, 1.36), new THREE.MeshStandardMaterial({ color: 0x0d0e13, roughness: 0.58, metalness: 0.16 }), KEY_COUNT);

    const ATLAS_COLS = 12, ATLAS_ROWS = 7, ATLAS_W = 2048, ATLAS_H = 1280;

    function getKeyPalette(k) {
      const jewel = ELEMENT_META[k.group].css;
      if (k.group === 'esc' || k.group === 'enter') {
        return { baseHex: 0xdfa83b, topGradA: '#f8d47a', topGradB: '#b9811e', text: '#0c0d11', glow: 'rgba(255,245,200,0.45)', rim: 'rgba(255,248,220,0.65)', accentBar: '#0c0d11', isGold: true };

    }

    const keyUvRects = new Float32Array(KEY_COUNT * 4);
    function buildArtisanLegendAtlas() {
      const c = document.createElement('canvas'); c.width = ATLAS_W; c.height = ATLAS_H;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#12151d'; ctx.fillRect(0, 0, ATLAS_W, ATLAS_H);
      const cellW = ATLAS_W / ATLAS_COLS, cellH = ATLAS_H / ATLAS_ROWS;
      const padU = 2 / ATLAS_W, padV = 2 / ATLAS_H;
      const rRect = (x, y, w, h, r) => {
        ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
      };

        const col = i % ATLAS_COLS, row = Math.floor(i / ATLAS_COLS);
        const x0 = col * cellW, y0 = row * cellH, pal = getKeyPalette(k);
        ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, cellW, cellH); ctx.clip();
        const cx = x0 + cellW * 0.5, cy = y0 + cellH * 0.5;
        const diag = ctx.createLinearGradient(x0, y0, x0 + cellW, y0 + cellH);
        diag.addColorStop(0, pal.topGradA); diag.addColorStop(0.55, pal.topGradB); diag.addColorStop(1, pal.topGradA);
        ctx.fillStyle = diag; ctx.fillRect(x0, y0, cellW, cellH);

        const dish = ctx.createRadialGradient(cx, cy - cellH * 0.08, cellW * 0.05, cx, cy, cellW * 0.52);
        dish.addColorStop(0, pal.isGold ? 'rgba(255,250,230,0.22)' : 'rgba(255,235,190,0.06)');
        dish.addColorStop(1, 'rgba(0,0,0,0.22)');
        ctx.fillStyle = dish; ctx.fillRect(x0, y0, cellW, cellH);

        const aspect = k.keyW / k.keyD;
        ctx.translate(cx, cy);
        if (aspect > 1.05) ctx.scale(1 / aspect, 1);
        else if (aspect < 0.95) ctx.scale(1, aspect);

        const bw = (aspect > 1.05 ? cellW * aspect : cellW) - 22;
        const bh = (aspect < 0.95 ? cellH / aspect : cellH) - 22;
        rRect(-bw * 0.5, -bh * 0.5, bw, bh, Math.min(22, bh * 0.35));
        ctx.strokeStyle = pal.rim; ctx.lineWidth = 3.2; ctx.stroke();

        if (k.kh >= 0.7) {

          ctx.save(); ctx.shadowColor = pal.accentBar; ctx.shadowBlur = 12; ctx.fillStyle = pal.accentBar;
          rRect(-barW * 0.5, bh * 0.5 - 12, barW, 4.5, 2.5); ctx.fill(); ctx.restore();
        }
        if (pal.isGold) {
          ctx.fillStyle = 'rgba(12,13,17,0.42)';
          [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sy]) => {
            ctx.beginPath(); ctx.arc(sx * (bw * 0.5 - 14), sy * (bh * 0.5 - 14), 3, 0, Math.PI * 2); ctx.fill();
          });
        }

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = pal.isGold ? 'rgba(255,255,255,0.35)' : pal.glow;
        ctx.shadowBlur = pal.isGold ? 4 : 11;

        if (k.group === 'space') {
          const sg = ctx.createLinearGradient(-150, 0, 150, 0);
          sg.addColorStop(0, 'rgba(234,182,77,0.08)'); sg.addColorStop(0.25, '#eab64d');
          sg.addColorStop(0.5, '#fff4cc'); sg.addColorStop(0.75, '#eab64d'); sg.addColorStop(1, 'rgba(234,182,77,0.08)');
          ctx.fillStyle = sg; rRect(-145, -3.5, 290, 7, 3.5); ctx.fill();
          ctx.fillStyle = '#fff9e6'; ctx.beginPath();
          ctx.moveTo(0,-13); ctx.lineTo(10,0); ctx.lineTo(0,13); ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();

        keyUvRects[i * 4 + 1] = 1 - (row + 1) / ATLAS_ROWS + padV;
        keyUvRects[i * 4 + 2] = 1 / ATLAS_COLS - padU * 2;

      });

      tex.encoding = THREE.sRGBEncoding;

    }

    const legendAtlasTex = buildArtisanLegendAtlas();
    const TOP_SCALE_X = 0.85, TOP_SCALE_Z = 0.83, KEY_CORNER_R = 0.16;

    function createSculptedKeycapBaseGeometry() {
      const geo = new THREE.BoxGeometry(1, KEY_H, 1, 8, 5, 8);
      geo.translate(0, KEY_H * 0.5, 0);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        [x, z] = roundSquarePoint(x, z, KEY_CORNER_R);

        const shoulder = t > 0.82 ? Math.pow((t - 0.82) / 0.18, 2) * 0.045 : 0;
        const tCurve = Math.pow(t, 0.82);
        x *= THREE.MathUtils.lerp(1.0, TOP_SCALE_X, tCurve) - shoulder;
        z *= THREE.MathUtils.lerp(1.0, TOP_SCALE_Z, tCurve) - shoulder;
        if (t > 0.90) y -= 0.042 * (1 - Math.min(1, (x * x + z * z) * 4.6));
        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

      const geo = new THREE.PlaneGeometry(1, 1, 8, 8);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i), z = pos.getZ(i);

        x *= (TOP_SCALE_X - 0.048); z *= (TOP_SCALE_Z - 0.048);
        const y = KEY_H + 0.008 - 0.042 * (1 - Math.min(1, (x * x + z * z) * 4.6));
        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const keycapBaseGeo = createSculptedKeycapBaseGeometry();
    const keycapTopGeo = createSculptedKeycapTopGeometry();

    const keycapBaseInst = new THREE.InstancedMesh(
      keycapBaseGeo,
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.34, metalness: 0.22, clearcoat: 0.55, clearcoatRoughness: 0.22 }),
      KEY_COUNT
    );
    keycapBaseInst.castShadow = true; keycapBaseInst.receiveShadow = true; keycapBaseInst.frustumCulled = false;
    scene.add(keycapBaseInst);

    const keycapTopInstGeo = keycapTopGeo.clone();
    keycapTopInstGeo.setAttribute('aUvRect', new THREE.InstancedBufferAttribute(keyUvRects, 4));
    const keycapTopInstMat = new THREE.MeshPhysicalMaterial({
      map: legendAtlasTex, emissive: 0xffffff, emissiveMap: legendAtlasTex, emissiveIntensity: 0.30,

    };

    keycapTopInst.receiveShadow = true; keycapTopInst.frustumCulled = false;

    KEYS.forEach((k, i) => keycapBaseInst.setColorAt(i, new THREE.Color(getKeyPalette(k).baseHex)));
    keycapBaseInst.instanceColor.needsUpdate = true;

    const animKeyGroup = new THREE.Group();
    scene.add(animKeyGroup);

    function createAnimatingKeyMesh(k) {
      const grp = new THREE.Group(), pal = getKeyPalette(k);
      const base = new THREE.Mesh(keycapBaseGeo, new THREE.MeshPhysicalMaterial({
        color: pal.baseHex, roughness: pal.isGold ? 0.20 : 0.34, metalness: pal.isGold ? 0.88 : 0.22, clearcoat: 0.60, clearcoatRoughness: 0.20
      }));
      base.scale.set(k.keyW, 1, k.keyD); base.castShadow = true; base.receiveShadow = true;

    const _projVec = new THREE.Vector3();
    function spawnFloatPopup(worldPos, title, sub, cssColor) {
      _projVec.copy(worldPos).project(camera);

    function getMult() {
      const base = game.combo >= 24 ? 4 : game.combo >= 12 ? 3 : game.combo >= 5 ? 2 : 1;
      return game.overdrive ? base * 2 : base;
    }

    function getRank() {
      if (game.score >= 20000) return 'RANK S+';
      if (game.score >= 10000) return 'RANK S';
      if (game.score >= 4500)  return 'RANK A';
      if (game.score >= 1500)  return 'RANK B';
      return 'RANK C';
    }

    function addScore(pts) {
      game.score += pts;
      if (game.score > game.bestScore) game.bestScore = game.score;
      gsap.to(game, {
        displayScore: game.score,
        duration: 0.30,
        ease: 'power2.out',
        onUpdate: () => { scoreValEl.textContent = Math.round(game.displayScore).toLocaleString(); }
      });
    }

    function shortKeyText(code) {
      const k = KEY_BY_CODE.get(code);
      if (!k) return code;
      if (k.group === 'space') return 'SPC';
      if (k.code === 'Enter') return 'ENT';
      if (k.code === 'ShiftLeft') return 'SHF';
      return k.label || code;
    }

    function renderGameRibbon() {
      if (game.mode === 'zen') {
        ribbonEl.classList.remove('visible');
        return;
      }
      ribbonEl.classList.add('visible');

      if (game.mode === 'melody') {
        const song = MELODIES[game.melodyIdx % MELODIES.length];
        ribbonTagEl.textContent = song.name;
        const start = Math.max(0, game.seqPos - 2);
        const end = Math.min(game.seqCodes.length, start + 8);
        ribbonKeysEl.innerHTML = '';
        for (let i = start; i < end; i++) {
          const tile = document.createElement('span');
          tile.className = 'r-tile' + (i < game.seqPos ? ' done' : i === game.seqPos ? ' current' : '');
          tile.textContent = shortKeyText(game.seqCodes[i]);
          ribbonKeysEl.appendChild(tile);
        }
        const acc = game.attempts > 0 ? Math.round((game.hits / game.attempts) * 100) : 100;
        ribbonStatEl.textContent = `ACC ${acc}%`;
      } else if (game.mode === 'word') {
        ribbonTagEl.textContent = `⚡ WORD ${game.wordsCleared + 1}`;
        ribbonKeysEl.innerHTML = '';
        for (let i = 0; i < game.seqCodes.length; i++) {
          const tile = document.createElement('span');
          tile.className = 'r-tile' + (i < game.seqPos ? ' done' : i === game.seqPos ? ' current' : '');
          tile.textContent = shortKeyText(game.seqCodes[i]);
          ribbonKeysEl.appendChild(tile);
        }
        ribbonStatEl.textContent = game.wpm > 0 ? `${game.wpm} WPM` : 'TYPE!';
      }
    }

    function clearActiveTargetVisual() {
      if (game.currentTargetKey) {
        const prev = game.currentTargetKey;
        prev.targetGlow = 0;
        if (prev.state === 'stored' && !prev.introTl && hoveredKey !== prev) {
          gsap.to(prev, { caseLiftY: 0, lidAngle: 0, duration: 0.24, ease: 'power2.out', onUpdate: () => { casesDirty = true; keycapsDirty = true; } });
        }
        game.currentTargetKey = null;
      }
      targetCaseAnchor.visible = false;
      targetDeckAnchor.visible = false;
      targetArcLine.visible = false;
      casesDirty = true;
    }

    function activateCurrentSequenceTarget() {
      clearActiveTargetVisual();
      if (game.mode === 'zen') return;
      const code = game.seqCodes[game.seqPos];
      const k = KEY_BY_CODE.get(code);
      if (!k) return;

      game.currentTargetKey = k;
      game.targetStartTime = clock.getElapsedTime();

      // Highlight glass case (if stored) & switch beacon on keyboard deck!
      if (k.state === 'stored') {
        if (k.introTl) { k.introTl.kill(); k.introTl = null; }
        gsap.to(k, {
          caseLiftY: 0.56,
          lidAngle: -THREE.MathUtils.degToRad(32),
          duration: 0.26,
          ease: 'back.out(1.7)',
          onUpdate: () => { casesDirty = true; keycapsDirty = true; }
        });
        targetCaseAnchor.visible = true;
        targetArcLine.visible = true;
        writeArc(targetArcGeo, k);
      } else {
        // Key is already installed on the keyboard -> spotlight directly on the installed keycap!
        targetCaseAnchor.visible = false;
        targetArcLine.visible = false;
      }

      targetDeckAnchor.visible = true;
      targetDeckAnchor.position.set(k.plateX, PLATE_Y + 0.08, k.plateZ);
      casesDirty = true;
      renderGameRibbon();
    }

    function loadMelody(idx) {
      game.melodyIdx = idx % MELODIES.length;
      game.seqCodes = MELODIES[game.melodyIdx].codes.slice();
      game.seqPos = 0;
      activateCurrentSequenceTarget();
    }

    function loadWord(idx) {
      game.wordIdx = idx % WORDS.length;
      const word = WORDS[game.wordIdx];
      game.seqCodes = word.split('').map(ch => 'Key' + ch).concat(['Space']);
      game.seqPos = 0;
      game.wordStartTime = clock.getElapsedTime();
      activateCurrentSequenceTarget();
    }

    function setGameMode(mode) {
      game.mode = mode;
      btnMelody.classList.toggle('active', mode === 'melody');
      btnWord.classList.toggle('active', mode === 'word');
      btnZen.classList.toggle('active', mode === 'zen');

      if (mode === 'melody') {
        hudModeTip.textContent = 'Hit the glowing key in the GOLD ring!';
        loadMelody(game.melodyIdx);
      } else if (mode === 'word') {
        hudModeTip.textContent = 'Type the glowing gold words to forge keys';
        loadWord(game.wordIdx);
      } else {
        hudModeTip.textContent = 'Free Zen Studio — tap any key to jam';
        clearActiveTargetVisual();
        renderGameRibbon();
      }
      updateHUD();

    function updateHUD() {
      let count = 0;
      for (let i = 0; i < KEY_COUNT; i++) if (KEYS[i].state === 'installed') count++;
      counterEl.textContent = `${count} / ${KEY_COUNT}`;
      rankPillEl.textContent = getRank();
      progressEl.style.width = `${(count / KEY_COUNT) * 100}%`;
      bestLabelEl.textContent = `BEST ${game.bestScore.toLocaleString()}`;
      resetBtn.disabled = count === 0 && installedOrder.length === 0;
      cascadeBtn.disabled = count === KEY_COUNT;

      feverFillEl.classList.toggle('overdrive', game.overdrive);

    function updateNoteReadout(k, voice) {
      const meta = ELEMENT_META[k.group];
      elKey.textContent = k.group === 'space' ? 'SPACE' : (k.label || k.code);
      elSound.textContent = voice ? voice.label : meta.name;

      pulseEqualizer(meta.css);

    // Score & Combo processing on key hit!
    function processGameplayHit(k, voice) {
      const meta = ELEMENT_META[k.group];
      updateNoteReadout(k, voice);

      // Zen Mode: rewarding free-jam flow scoring (zero errors!)
      if (game.mode === 'zen') {
        game.combo++;
        const pts = 100 * getMult();
        addScore(pts);
        boostFever(9);
        popCombo();
        spawnFloatPopup(k.switchWorldPos, `♪ ${voice.label}`, `+${pts}`, meta.css);
        updateHUD();
        return 'zen';
      }

      // Melody Rush / Word Forge: Check if player hit the glowing target key!
      game.attempts++;
      if (k === game.currentTargetKey) {
        game.hits++;
        game.combo++;
        popCombo();

        // Check rhythm timing ring phase in Melody Rush!
        const elapsed = clock.getElapsedTime() - game.targetStartTime;
        const cycle = (elapsed % game.targetBeatWindow) / game.targetBeatWindow;
        let grade = 'great', gradeTxt = 'GREAT!', basePts = 180, gradeCss = '#22d3ee';
        if (game.mode === 'melody') {
          if (cycle >= 0.36 && cycle <= 0.82) {
            grade = 'perfect'; gradeTxt = 'PERFECT!'; basePts = 300; gradeCss = '#fae09e';
          }
        } else {
          // Word Forge rewards brisk clean typing
          if (elapsed < 1.1) {
            grade = 'perfect'; gradeTxt = 'SHARP!'; basePts = 250; gradeCss = '#fae09e';
          }
        }

        const totalPts = basePts * getMult();
        addScore(totalPts);
        boostFever(grade === 'perfect' ? 20 : 12);
        spawnFloatPopup(k.switchWorldPos, `${gradeTxt} +${totalPts}`, `♪ ${voice.label}`, gradeCss);

        // Advance sequence!
        game.seqPos++;
        if (game.seqPos >= game.seqCodes.length) {
          // Sequence / Word Completed Bonus!
          const clearBonus = 600 * getMult();
          addScore(clearBonus);
          SoundEngine.playFanfare();
          if (game.mode === 'word') {
            game.wordsCleared++;
            const secs = Math.max(0.5, clock.getElapsedTime() - game.wordStartTime);
            const chars = game.seqCodes.length;
            game.wpm = Math.round((chars / 5) / (secs / 60));
            spawnFloatPopup(new THREE.Vector3(0, 5.5, 4), `WORD CLEAR! +${clearBonus}`, `${game.wpm} WPM`, '#fae09e');
            loadWord(game.wordIdx + 1);
          } else {
            const doneName = MELODIES[game.melodyIdx].name;
            spawnFloatPopup(new THREE.Vector3(0, 5.5, 4), `MELODY CLEAR! +${clearBonus}`, doneName, '#fae09e');
            loadMelody(game.melodyIdx + 1);
          }
        } else {
          activateCurrentSequenceTarget();
        }
        updateHUD();
        return grade;
      } else {
        // Off-target tap: gentle combo reset + soft visual nudge (NO harsh game over!)
        game.combo = 0;
        game.fever = Math.max(0, game.fever - 10);
        SoundEngine.playSoftError();
        hudCenter.classList.remove('shake'); void hudCenter.offsetWidth; hudCenter.classList.add('shake');
        spawnFloatPopup(k.switchWorldPos, `♪ ${voice.label}`, 'FOLLOW GOLD KEY', '#fb7185');
        renderGameRibbon();
        updateHUD();
        return 'off';
      }
    }

    function popCombo() {
      comboRowEl.classList.remove('pop'); void comboRowEl.offsetWidth; comboRowEl.classList.add('pop');
      setTimeout(() => comboRowEl.classList.remove('pop'), 150);
