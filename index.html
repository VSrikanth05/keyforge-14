    function boostFever(amount) {
      if (!game.overdrive) {
        game.fever = Math.min(100, game.fever + amount);
        if (game.fever >= 100) {
          game.overdrive = true;
          game.overdriveLeft = 8.0;
          SoundEngine.playFanfare();
          spawnFloatPopup(new THREE.Vector3(0, 7.2, 2), 'AURUM OVERDRIVE ×2!', 'PRISMATIC GOLD BOOST', '#fae09e');
        }
      } else {
        game.overdriveLeft = Math.min(8.5, game.overdriveLeft + 0.45);
      }
    }

    const COL_CYAN = new THREE.Color(0x0ea5e9), COL_GOLD = new THREE.Color(0xf59e0b);
    const _ringCol = new THREE.Color();

    function updateGameplayVisuals(dt, elapsed) {
      if (game.overdrive) {
        game.overdriveLeft -= dt;
        if (game.overdriveLeft <= 0) {
          game.overdrive = false; game.overdriveLeft = 0; game.fever = 0;
        }
        updateHUD();
      }

      const k = game.currentTargetKey;
      if (!k || game.mode === 'zen') return;

      // Repeating silky shrinking rhythm ring (Cyan -> Molten Gold sweet spot!)
      const p = ((elapsed - game.targetStartTime) % game.targetBeatWindow) / game.targetBeatWindow;
      const inGold = (game.mode === 'word') || (p >= 0.36 && p <= 0.82);

      if (inGold) {
        _ringCol.copy(COL_GOLD);
        k.targetColorHex = 0xf59e0b;
      } else {
        _ringCol.copy(COL_CYAN).lerp(COL_GOLD, THREE.MathUtils.clamp((p - 0.20) / 0.16, 0, 1));
        k.targetColorHex = _ringCol.getHex();
      }

      const pulse = 0.78 + 0.22 * Math.sin(elapsed * 12);
      k.targetGlow = inGold ? 1.0 : 0.76 * pulse;
      casesDirty = true;

      // Case shrinking timing ring (if keycap is still stored in its glass case)
      if (k.state === 'stored' && targetCaseAnchor.visible) {
        targetCaseAnchor.position.set(k.rackX, k.caseLiftY + CASE_H + 0.16, k.rackZ);
        targetLockRing.scale.set(k.caseW * 1.04, 1, k.caseD * 1.04);
        targetLockRing.material.color.setHex(inGold ? 0xfef08a : 0xf59e0b);
        targetLockRing.material.opacity = inGold ? 0.96 : 0.48;

        const shrink = game.mode === 'melody' ? THREE.MathUtils.lerp(1.85, 0.96, p) : (1.16 + 0.12 * Math.sin(elapsed * 8));
        targetApproachRing.scale.set(k.caseW * shrink, 1, k.caseD * shrink);
        targetApproachRing.material.color.copy(_ringCol);
        targetApproachRing.material.opacity = inGold ? 1.0 : 0.88;
      }

      // Keyboard switch beam & pulsing reticle
      targetDeckAnchor.position.set(k.plateX, PLATE_Y + 0.08, k.plateZ);
      targetBeam.material.color.copy(_ringCol);
      targetBeam.material.opacity = (inGold ? 0.54 : 0.36) * pulse;
      targetBeam.scale.set(1, 0.88 + 0.18 * pulse, 1);

      const dScale = game.mode === 'melody' ? THREE.MathUtils.lerp(1.65, 0.94, p) : (1.05 + 0.14 * Math.sin(elapsed * 8));
      targetDeckRing.scale.set(dScale, 1, dScale);
      targetDeckRing.material.color.copy(_ringCol);

      if (targetArcLine.visible) {
        targetArcLine.material.color.copy(_ringCol);
        targetArcLine.material.opacity = inGold ? 0.62 : 0.34;
      }
    }

    function triggerKeyElementEffect(k, isLanding = false, grade = null) {
      const now = clock.getElapsedTime();
      const meta = ELEMENT_META[k.group];

      chassisAccent.targetColor.setHex(grade === 'perfect' ? 0xf59e0b : meta.hex);
      chassisAccent.boost = 1.0;

      if (isLanding || grade === 'perfect') {
        const sparkHex = grade === 'perfect' ? 0xfbbf24 : meta.hex;
        emitSparks(k.switchWorldPos, sparkHex, grade === 'perfect' ? 32 : 22, null, grade === 'perfect' ? 1.2 : 1.05);
        emitSparks(k.switchWorldPos, 0xf9dc94, 10, null, 0.85, true);
      }
      if (grade === 'perfect') {
        spawnExpandingRing(k.plateX, k.plateZ, 0xfbbf24, 6.2, 0.56, false);
      }

      if (k.group === 'alpha') {
        activeWaves.push({ type: 'alpha', ox: k.plateX, oz: k.plateZ, start: now, dur: 1.05, hueBase: (k.index * 0.085) % 1.0 });
        spawnExpandingRing(k.plateX, k.plateZ, meta.hex, 5.0, 0.55, false);
        if (!isLanding) emitSparks(k.switchWorldPos, meta.hex, 14, null, 0.80, true);
      } else if (k.group === 'number') {
        spawnExpandingRing(k.plateX, k.plateZ, 0x38bdf8, 7.6, 0.62, false, 0);
        spawnExpandingRing(k.plateX, k.plateZ, 0xeab64d, 5.2, 0.56, false, 0.08);
        activeWaves.push({ type: 'number', ox: k.plateX, oz: k.plateZ, start: now, dur: 0.80 });
      } else if (k.group === 'fn') {
        spawnLightPillar(k.plateX, k.plateZ, 0xc084fc, 0.95);
        activeWaves.push({ type: 'fn', ox: k.plateX, oz: k.plateZ, start: now, dur: 0.95 });
      } else if (k.group === 'arrow') {
        const [dx, dz] = k.dir || [0, -1];
        const worldDir = new THREE.Vector3(dx, 0, dz).applyQuaternion(deckWorldQuat).normalize();
        emitSparks(k.switchWorldPos, 0x10b981, 22, worldDir, 1.15);
        emitSparks(k.switchWorldPos, 0x22d3ee, 10, worldDir, 0.90);
        activeWaves.push({ type: 'arrow', ox: k.plateX, oz: k.plateZ, dx, dz, start: now, dur: 0.84 });
      } else if (k.group === 'space') {
        activeWaves.push({ type: 'space', ox: k.plateX, oz: k.plateZ, start: now, dur: 1.08 });
        spawnExpandingRing(k.plateX, k.plateZ, 0xeab64d, 9.5, 0.72, false);
        gsap.killTweensOf(spaceBarMesh.scale); gsap.killTweensOf(spaceBarMesh.material);
        spaceBarMesh.visible = true; spaceBarMesh.scale.set(0.14, 1, 1); spaceBarMesh.material.opacity = 0.92;
        gsap.to(spaceBarMesh.scale, { x: 1.24, duration: 0.58, ease: 'power2.out' });
        gsap.to(spaceBarMesh.material, { opacity: 0, duration: 0.70, ease: 'power2.out', onComplete: () => { spaceBarMesh.visible = false; } });
      } else if (k.group === 'enter') {
        activeWaves.push({ type: 'enter', ox: k.plateX, oz: k.plateZ, start: now, dur: 0.72 });
        spawnLightPillar(k.plateX, k.plateZ, 0xfbbf24, 1.35);
        spawnExpandingRing(k.plateX, k.plateZ, 0xfb923c, 6.8, 0.55, false);
        fxPointLight.color.setHex(0xfbbf24);
        fxPointLight.position.copy(k.switchWorldPos).addScaledVector(deckUpWorld, 2.4);
        gsap.killTweensOf(fxPointLight); fxPointLight.intensity = 4.0;
        gsap.to(fxPointLight, { intensity: 0, duration: 0.48, ease: 'power3.out' });
      } else if (k.group === 'esc') {
        activeWaves.push({ type: 'esc', ox: k.plateX, oz: k.plateZ, start: now, dur: 1.15 });
        spawnExpandingRing(k.plateX, k.plateZ, 0xfb7185, 8.8, 0.70, false);
        fxPointLight.color.setHex(0xfb7185);
        fxPointLight.position.copy(k.switchWorldPos).addScaledVector(deckUpWorld, 2.6);
        gsap.killTweensOf(fxPointLight); fxPointLight.intensity = 3.2;
        gsap.to(fxPointLight, { intensity: 0, duration: 0.55, ease: 'power2.out' });
      } else if (k.group === 'nav') {
        spawnExpandingRing(k.plateX, k.plateZ, 0x2dd4bf, 6.0, 0.58, true);
        activeWaves.push({ type: 'mod', ox: k.plateX, oz: k.plateZ, start: now, dur: 0.72, colorHex: 0x2dd4bf });
      } else {
        spawnExpandingRing(k.plateX, k.plateZ, meta.hex, 5.0, 0.52, false);
        activeWaves.push({ type: 'mod', ox: k.plateX, oz: k.plateZ, start: now, dur: 0.70, colorHex: meta.hex });
      }
    }

    // =========================================================================
    // 12. SWITCH RGB LEDS & DUAL PERIMETER UNDERGLOW
    // =========================================================================
    const _ledCol = new THREE.Color(), _waveCol = new THREE.Color(), _goldIdle = new THREE.Color(0xeab64d);

    function updateSwitchLEDs(elapsed, dt) {
      for (let w = activeWaves.length - 1; w >= 0; w--) {
        if (elapsed - activeWaves[w].start > activeWaves[w].dur) activeWaves.splice(w, 1);
      }

      if (game.overdrive) {
        chassisAccent.color.setHSL((elapsed * 0.25) % 1, 0.92, 0.60);
        chassisAccent.boost = 1.0;
      } else {
        chassisAccent.boost = Math.max(0, chassisAccent.boost - dt * 0.85);
        chassisAccent.targetColor.lerp(_goldIdle, dt * 0.65);
        chassisAccent.color.lerp(chassisAccent.targetColor, Math.min(1, dt * 8));
      }

      if (underglowStripMat && deskHaloMat) {
        underglowStripMat.color.copy(chassisAccent.color);
        underglowStripMat.opacity = 0.74 + chassisAccent.boost * 0.24;
        deskHaloMat.color.copy(chassisAccent.color);
        deskHaloMat.opacity = 0.28 + chassisAccent.boost * 0.22;
      }
      if (rackGlowStripMat) {
        rackGlowStripMat.color.copy(chassisAccent.color);
        rackGlowStripMat.opacity = 0.58 + chassisAccent.boost * 0.34;
      }

      for (let i = 0; i < KEY_COUNT; i++) {
        const k = KEYS[i];
        if (game.overdrive) {
          _ledCol.setHSL((elapsed * 0.30 + k.plateX * 0.03 - k.plateZ * 0.03) % 1, 0.92, k.state === 'installed' ? 0.55 : 0.34);
        } else {
          const breath = 0.5 + 0.5 * Math.sin(elapsed * 1.45 + k.plateX * 0.16 - k.plateZ * 0.22);
          if (k.state === 'installed') _ledCol.setRGB(0.36 + breath * 0.22, 0.25 + breath * 0.16, 0.08 + breath * 0.07);
          else _ledCol.setRGB(0.20 + breath * 0.12, 0.14 + breath * 0.08, 0.04 + breath * 0.04);
        }

        if (game.currentTargetKey === k) {
          _waveCol.setHex(k.targetColorHex);
          _ledCol.lerp(_waveCol, 0.95);
        }
        if (hoveredKey === k) {
          _waveCol.setHex(ELEMENT_META[k.group].hex);
          _ledCol.lerp(_waveCol, 0.90);
        }

        for (let w = 0; w < activeWaves.length; w++) {
          const ev = activeWaves[w], p = (elapsed - ev.start) / ev.dur, fade = 1 - p;
          const dx = k.plateX - ev.ox, dz = k.plateZ - ev.oz, dist = Math.hypot(dx, dz);
          if (ev.type === 'alpha') {
            const ring = Math.exp(-Math.pow((dist - p * 14.5) / 2.3, 2)) * fade;
            if (ring > 0.02) { _waveCol.setHSL((ev.hueBase + dist * 0.04 + p * 0.30) % 1, 0.96, 0.58); _ledCol.r += _waveCol.r*ring*1.55; _ledCol.g += _waveCol.g*ring*1.55; _ledCol.b += _waveCol.b*ring*1.55; }
          } else if (ev.type === 'number') {
            const r1 = Math.exp(-Math.pow((dist - p * 16.0) / 1.4, 2)) * fade;
            const r2 = Math.exp(-Math.pow((dist - Math.max(0, p - 0.12) * 12.5) / 1.4, 2)) * fade;
            if (r1 > 0.02) { _ledCol.r += 0.22*r1*1.85; _ledCol.g += 0.80*r1*1.85; _ledCol.b += 1.00*r1*1.85; }
            if (r2 > 0.02) { _ledCol.r += 1.00*r2*1.45; _ledCol.g += 0.74*r2*1.45; _ledCol.b += 0.22*r2*1.45; }
          } else if (ev.type === 'fn') {
            const rf = k.row === 0 ? 1.0 : k.row === 1 ? 0.36 : 0;
            if (rf > 0) {
              const amt = Math.exp(-Math.pow((Math.abs(dx) - p * 26) / 3.8, 2)) * fade * rf * 1.6 + Math.exp(-dist * 0.28) * Math.pow(Math.max(0, fade), 2) * 1.3;
              _ledCol.r += 0.78*amt; _ledCol.g += 0.48*amt; _ledCol.b += 1.00*amt;
            }
          } else if (ev.type === 'arrow') {
            const proj = dx * ev.dx + dz * ev.dz, perp = Math.abs(dx * -ev.dz + dz * ev.dx), head = p * 30;
            if (proj >= -1.5 && proj <= head + 2.5) {
              const tr = Math.exp(-Math.pow((head - proj) / 5.0, 2)) * Math.exp(-perp * 0.28) * fade;
              _ledCol.r += 0.10*tr*2.0; _ledCol.g += 0.96*tr*2.0; _ledCol.b += 0.62*tr*2.0;
            }
          } else if (ev.type === 'space') {
            const rf = k.row === 5 ? 1.0 : k.row === 4 ? 0.50 : k.row === 3 ? 0.22 : 0.08;
            const wave = Math.exp(-Math.pow((Math.abs(dx) - p * 26) / 4.2, 2)) * fade * rf;
            if (wave > 0.02) { _waveCol.setHSL((0.12 + p * 0.55 + Math.abs(dx) * 0.015) % 1, 0.94, 0.58); _ledCol.r += _waveCol.r*wave*1.85; _ledCol.g += _waveCol.g*wave*1.85; _ledCol.b += _waveCol.b*wave*1.85; }
          } else if (ev.type === 'enter') {
            const b = Math.exp(-dist * 0.22) * Math.pow(Math.max(0, fade), 1.35);
            _ledCol.r += 1.00*b*2.1; _ledCol.g += 0.68*b*2.1; _ledCol.b += 0.16*b*2.1;
          } else if (ev.type === 'esc') {
            const ring = Math.exp(-Math.pow((dist - p * 36) / 3.8, 2)) * fade;
            _ledCol.r += 1.00*ring*1.9; _ledCol.g += 0.26*ring*1.9; _ledCol.b += 0.34*ring*1.9;
          } else {
            const ring = Math.exp(-Math.pow((dist - p * 10.0) / 2.2, 2)) * fade;
            if (ring > 0.02) { _waveCol.setHex(ev.colorHex || 0xf43f5e); _ledCol.r += _waveCol.r*ring*1.55; _ledCol.g += _waveCol.g*ring*1.55; _ledCol.b += _waveCol.b*ring*1.55; }
          }
        }

        _ledCol.r = Math.min(1, _ledCol.r); _ledCol.g = Math.min(1, _ledCol.g); _ledCol.b = Math.min(1, _ledCol.b);
        swLedInst.setColorAt(i, _ledCol); swGlowInst.setColorAt(i, _ledCol);
      }
      swLedInst.instanceColor.needsUpdate = true; swGlowInst.instanceColor.needsUpdate = true;
    }

    // =========================================================================
    // 13. MANUAL ORBIT CONTROLS
    // =========================================================================
    const DEFAULT_ORBIT = { theta: 0.03, phi: 0.99, radius: 55, target: new THREE.Vector3(0, 4.7, 0.6) };
    const orbit = {
      theta: DEFAULT_ORBIT.theta, phi: DEFAULT_ORBIT.phi, radius: DEFAULT_ORBIT.radius, target: DEFAULT_ORBIT.target.clone(),
      curTheta: DEFAULT_ORBIT.theta, curPhi: DEFAULT_ORBIT.phi, curRadius: DEFAULT_ORBIT.radius, curTarget: DEFAULT_ORBIT.target.clone(),
      nudge: new THREE.Vector3(), isDragging: false, isPanning: false, lastX: 0, lastY: 0, movedDist: 0, pinchDist: 0
    };

    function updateResponsiveDistance() {
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      orbit.radius = aspect < 1.35 ? THREE.MathUtils.clamp(55 * (1.35 / aspect), 55, 88) : DEFAULT_ORBIT.radius;
    }
    updateResponsiveDistance(); orbit.curRadius = orbit.radius;

    function resetCameraView() {
      orbit.theta = DEFAULT_ORBIT.theta; orbit.phi = DEFAULT_ORBIT.phi; updateResponsiveDistance(); orbit.target.copy(DEFAULT_ORBIT.target);
    }

    function triggerCameraNudge(targetWorldPos) {
      const dx = (targetWorldPos.x - orbit.target.x) * 0.07, dy = (targetWorldPos.y - orbit.target.y) * 0.04, dz = (targetWorldPos.z - orbit.target.z) * 0.055;
      gsap.killTweensOf(orbit.nudge);
      gsap.timeline()
        .to(orbit.nudge, { x: dx, y: dy, z: dz, duration: 0.34, ease: 'power2.out' })
        .to(orbit.nudge, { x: 0, y: 0, z: 0, duration: 0.72, ease: 'power2.inOut' }, '+=0.08');
    }

    function updateCamera() {
      const damp = 0.11;
      orbit.curTheta += (orbit.theta - orbit.curTheta) * damp;
      orbit.curPhi += (orbit.phi - orbit.curPhi) * damp;
      orbit.curRadius += (orbit.radius - orbit.curRadius) * damp;
      orbit.curTarget.lerp(orbit.target, damp);

      const tx = orbit.curTarget.x + orbit.nudge.x, ty = orbit.curTarget.y + orbit.nudge.y, tz = orbit.curTarget.z + orbit.nudge.z;
      const sinPhi = Math.sin(orbit.curPhi);
      camera.position.set(tx + orbit.curRadius * sinPhi * Math.sin(orbit.curTheta), ty + orbit.curRadius * Math.cos(orbit.curPhi), tz + orbit.curRadius * sinPhi * Math.cos(orbit.curTheta));
      camera.lookAt(tx, ty, tz);
    }

    // =========================================================================
    // 14. INSTALL, PRESS, ASSEMBLE SYMPHONY & REVERSE-ORDER RESET
    // =========================================================================
    function acquireAnimMesh(k) {
      if (!k.animMesh) { k.animMesh = createAnimatingKeyMesh(k); animKeyGroup.add(k.animMesh); }
      keycapsDirty = true;
      return k.animMesh;
    }
    function releaseAnimMesh(k) {
      if (k.animMesh) {
        animKeyGroup.remove(k.animMesh);
        k.animMesh.traverse(obj => { if (obj.geometry && obj.geometry !== keycapBaseGeo) obj.geometry.dispose(); if (obj.material) obj.material.dispose(); });
        k.animMesh = null;
      }
      keycapsDirty = true;
    }

    function installKey(k, silentCascade = false) {
      if (k.state !== 'stored') return;
      if (k.code === 'Escape' && installedOrder.length > 0 && !silentCascade) { resetAllKeys(); return; }

      if (k.introTl) { k.introTl.kill(); k.introTl = null; }
      if (k.activeTl) { k.activeTl.kill(); k.activeTl = null; }

      // Immediate musical & gameplay feedback on click/keypress!
      const voice = SoundEngine.playKeyMusic(k, silentCascade ? 0.42 : 1.0, false);
      let grade = null;
      if (!silentCascade) grade = processGameplayHit(k, voice);

      k.state = 'installing';
      k.caseHover = 0;
      k.targetGlow = 0;
      if (!installedOrder.includes(k)) installedOrder.push(k);
      casesDirty = true;
      updateHUD();

      if (!silentCascade) SoundEngine.playCaseTick();
      toggleIndicator(k.code);

      const mesh = acquireAnimMesh(k);
      const startPos = getStoredKeyWorldPos(k, new THREE.Vector3());
      const endPos = getInstalledKeyWorldPos(k, new THREE.Vector3(), 0);
      const pressedPos = getInstalledKeyWorldPos(k, new THREE.Vector3(), KEY_TRAVEL);
      mesh.position.copy(startPos); mesh.quaternion.copy(rackWorldQuat);

      const liftedPos = startPos.clone().addScaledVector(rackUpWorld, 2.35);
      const preLandPos = endPos.clone().addScaledVector(deckUpWorld, 2.1);
      const mid1 = startPos.clone().lerp(endPos, 0.32); mid1.y = Math.max(liftedPos.y, endPos.y) + 4.2; mid1.x += (k.plateX > 0 ? 1 : -1) * 0.7;
      const mid2 = startPos.clone().lerp(endPos, 0.72); mid2.y = Math.max(liftedPos.y * 0.65, endPos.y + 4.5);

      const curve = new THREE.CatmullRomCurve3([liftedPos, mid1, mid2, preLandPos]);
      const startQuat = rackWorldQuat.clone();
      const midFlourishQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.18, (k.plateX < 0 ? 0.14 : -0.14), (k.plateX < 0 ? -0.12 : 0.12)));
      const tmpQuat = new THREE.Quaternion();
      const flightProxy = { t: 0 };
      const trailColor = grade === 'perfect' ? 0xfbbf24 : ELEMENT_META[k.group].hex;
      let lastTrailT = 0;

      if (!silentCascade) triggerCameraNudge(endPos);

      const tl = gsap.timeline({
        onComplete: () => {
          k.state = 'installed'; k.pressY = 0; k.activeTl = null;
          releaseAnimMesh(k); updateHUD();
        }
      });
      k.activeTl = tl;

      tl.to(k, { lidAngle: LID_OPEN_ANGLE, caseLiftY: 0, duration: 0.20, ease: 'power2.out', onUpdate: () => { casesDirty = true; } }, 0);
      tl.to(mesh.position, { x: liftedPos.x, y: liftedPos.y, z: liftedPos.z, duration: 0.22, ease: 'back.out(2.0)' }, 0.05);
      tl.to(k, { lidAngle: 0, duration: 0.38, ease: 'power2.inOut', onUpdate: () => { casesDirty = true; } }, 0.28);
      tl.to(flightProxy, {
        t: 1, duration: 0.42, ease: 'power2.inOut',
        onUpdate: () => {
          curve.getPoint(flightProxy.t, mesh.position);
          tmpQuat.copy(startQuat).slerp(deckWorldQuat, flightProxy.t);
          mesh.quaternion.copy(tmpQuat).slerp(tmpQuat.clone().multiply(midFlourishQuat), Math.sin(flightProxy.t * Math.PI) * 0.45);
          if (flightProxy.t - lastTrailT > 0.11) { lastTrailT = flightProxy.t; emitSparks(mesh.position, trailColor, 2, null, 0.34); }
        }
      }, 0.24);
      tl.to(mesh.position, {
        x: pressedPos.x, y: pressedPos.y, z: pressedPos.z, duration: 0.07, ease: 'power3.in',
        onComplete: () => {
          mesh.quaternion.copy(deckWorldQuat);
          triggerKeyElementEffect(k, true, grade);
        }
      }, 0.66);
      tl.to(mesh.position, { x: endPos.x, y: endPos.y, z: endPos.z, duration: 0.085, ease: 'back.out(2.2)' }, 0.73);
    }

    function pressInstalledKey(k) {
      if (k.state !== 'installed') return;
      if (k.code === 'Escape') {
        SoundEngine.playKeyMusic(k, 1.0, false);
        triggerKeyElementEffect(k, false);
        resetAllKeys();
        return;
      }

      if (k.pressTl) { k.pressTl.kill(); k.pressTl = null; }
      toggleIndicator(k.code);
      const voice = SoundEngine.playKeyMusic(k, 1.0, false);
      const grade = processGameplayHit(k, voice);
      triggerKeyElementEffect(k, false, grade);

      const mesh = acquireAnimMesh(k);
      const restPos = getInstalledKeyWorldPos(k, new THREE.Vector3(), 0);
      const downPos = getInstalledKeyWorldPos(k, new THREE.Vector3(), KEY_TRAVEL);
      mesh.position.copy(restPos); mesh.quaternion.copy(deckWorldQuat);

      const tl = gsap.timeline({
        onComplete: () => { k.pressTl = null; if (k.state === 'installed') releaseAnimMesh(k); }
      });
      k.pressTl = tl;
      tl.to(mesh.position, { x: downPos.x, y: downPos.y, z: downPos.z, duration: 0.045, ease: 'power2.out' })
        .to(mesh.position, { x: restPos.x, y: restPos.y, z: restPos.z, duration: 0.075, ease: 'power2.inOut' });
    }

    let cascadeTimers = [];
    function cancelCascade() { cascadeTimers.forEach(id => clearTimeout(id)); cascadeTimers.length = 0; }

    function assembleAllCascade() {
      cancelCascade();
      const remaining = KEYS.filter(k => k.state === 'stored');
      if (remaining.length === 0) return;
      showToast(`Assembling ${remaining.length} keys in musical cascade…`);
      remaining.forEach((k, idx) => {
        cascadeTimers.push(setTimeout(() => { if (k.state === 'stored') installKey(k, true); }, idx * 34));
      });
    }

    function resetAllKeys() {
      cancelCascade();
      const toReturn = installedOrder.slice().reverse().filter(k => k.state === 'installed' || k.state === 'installing');
      if (toReturn.length === 0) return;

      installedOrder.length = 0;
      showToast(`Returning ${toReturn.length} key${toReturn.length > 1 ? 's' : ''} to cases…`);
      triggerKeyElementEffect(KEYS[0], false);

      const stagger = Math.min(0.032, 1.20 / Math.max(1, toReturn.length));
      toReturn.forEach((k, idx) => {
        if (k.activeTl) { k.activeTl.kill(); k.activeTl = null; }
        if (k.pressTl) { k.pressTl.kill(); k.pressTl = null; }
        k.state = 'returning';
        const mesh = acquireAnimMesh(k);
        const startPos = mesh.position.lengthSq() > 0.001 && k.animMesh ? mesh.position.clone() : getInstalledKeyWorldPos(k, new THREE.Vector3(), 0);
        const startQuat = mesh.quaternion.clone();
        if (startPos.distanceTo(getInstalledKeyWorldPos(k, new THREE.Vector3(), 0)) < 0.5) startQuat.copy(deckWorldQuat);

        const homePos = getStoredKeyWorldPos(k, new THREE.Vector3());
        const aboveHomePos = homePos.clone().addScaledVector(rackUpWorld, 2.2);
        const liftOffPos = startPos.clone().addScaledVector(deckUpWorld, 2.8);
        const midArc = startPos.clone().lerp(aboveHomePos, 0.5); midArc.y += 3.8;
        const curve = new THREE.CatmullRomCurve3([startPos, liftOffPos, midArc, aboveHomePos]);
        const proxy = { t: 0 };

        const tl = gsap.timeline({
          delay: idx * stagger,
          onStart: () => { if (idx % 3 === 0) SoundEngine.playCaseTick(); },
          onComplete: () => {
            k.state = 'stored'; k.activeTl = null; releaseAnimMesh(k); casesDirty = true; updateHUD();
            if (idx === toReturn.length - 1 && game.mode !== 'zen') activateCurrentSequenceTarget();
          }
        });
        k.activeTl = tl;
        tl.to(k, { lidAngle: LID_OPEN_ANGLE, duration: 0.22, ease: 'power2.out', onUpdate: () => { casesDirty = true; } }, 0.04);
        tl.to(proxy, { t: 1, duration: 0.40, ease: 'power2.inOut', onUpdate: () => { curve.getPoint(proxy.t, mesh.position); mesh.quaternion.copy(startQuat).slerp(rackWorldQuat, proxy.t); } }, 0);
        tl.to(mesh.position, { x: homePos.x, y: homePos.y, z: homePos.z, duration: 0.14, ease: 'power2.out' }, 0.40);
        tl.to(k, { lidAngle: 0, duration: 0.34, ease: 'power2.inOut', onUpdate: () => { casesDirty = true; } }, 0.52);
      });
      casesDirty = true; updateHUD();
    }

    // =========================================================================
    // 15. STAGGERED GSAP INTRO + GAME START
    // =========================================================================
    function playIntroAnimation() {
      const byRow = [[], [], [], [], [], []];
      KEYS.forEach(k => byRow[k.row].push(k));
      byRow.forEach(arr => arr.sort((a, b) => a.kx - b.kx));

      byRow.forEach((rowKeys, r) => {
        rowKeys.forEach((k, colIdx) => {
          const delay = 0.18 + r * 0.14 + colIdx * 0.022;
          const tl = gsap.timeline({ delay });
          k.introTl = tl;
          tl.to(k, { lidAngle: LID_OPEN_ANGLE, duration: 0.36, ease: 'power2.out', onUpdate: () => { casesDirty = true; } })
            .to(k, {
              lidAngle: 0, caseLiftY: 0, duration: 0.44, ease: 'power2.inOut',
              onUpdate: () => { casesDirty = true; keycapsDirty = true; },
              onComplete: () => { k.introTl = null; }
            }, '+=0.14');
        });
      });

      // Highlight the very first Melody target smoothly right as intro finishes!
      setTimeout(() => {
        if (game.mode === 'melody') loadMelody(0);
      }, 1750);
    }

    // =========================================================================
    // 16. UI EVENTS, RAYCASTER, HOVER & PHYSICAL KEYBOARD LISTENER
    // =========================================================================
    btnMelody.addEventListener('click', () => setGameMode('melody'));
    btnWord.addEventListener('click', () => setGameMode('word'));
    btnZen.addEventListener('click', () => setGameMode('zen'));
    ribbonNextBtn.addEventListener('click', () => {
      if (game.mode === 'melody') loadMelody(game.melodyIdx + 1);
      else if (game.mode === 'word') loadWord(game.wordIdx + 1);
    });
    cascadeBtn.addEventListener('click', () => assembleAllCascade());
    resetBtn.addEventListener('click', () => resetAllKeys());
    viewBtn.addEventListener('click', () => resetCameraView());
    soundBtn.addEventListener('click', () => {
      const isMuted = SoundEngine.toggleMute();
      soundBtn.textContent = isMuted ? '🔇 Muted' : '🔊 Music';
      soundBtn.classList.toggle('muted', isMuted);
    });

    const raycaster = new THREE.Raycaster(), pointerNDC = new THREE.Vector2(-10, -10);
    let hoveredKey = null;

    function updatePointerNDC(cx, cy) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;
    }

    function pickKeyUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects([caseHitInst, installedHitInst], false);
      if (hits.length === 0) return null;
      const hit = hits[0];
      if (hit.instanceId === undefined) return null;
      const k = KEYS[hit.instanceId];
      if (!k) return null;
      if (hit.object === caseHitInst && k.state === 'stored') return k;
      if (hit.object === installedHitInst && k.state === 'installed') return k;
      return null;
    }

    function setHoveredKey(k) {
      if (hoveredKey === k) return;
      if (hoveredKey) {
        const prev = hoveredKey;
        gsap.to(prev, { caseHover: 0, duration: 0.20, ease: 'power2.out', onUpdate: () => { casesDirty = true; } });
        if (prev.state === 'stored' && !prev.introTl && game.currentTargetKey !== prev) {
          gsap.to(prev, { caseLiftY: 0, lidAngle: 0, duration: 0.24, ease: 'power2.out', onUpdate: () => { casesDirty = true; keycapsDirty = true; } });
        }
      }
      hoveredKey = k;
      if (hoveredKey) {
        document.body.style.cursor = 'pointer';
        const cur = hoveredKey, meta = ELEMENT_META[cur.group];
        if (cur.state === 'stored') {
          gsap.to(cur, { caseHover: 1, duration: 0.14, ease: 'power2.out', onUpdate: () => { casesDirty = true; } });
          if (!cur.introTl && game.currentTargetKey !== cur) {
            gsap.to(cur, { caseLiftY: 0.34, lidAngle: -THREE.MathUtils.degToRad(20), duration: 0.20, ease: 'power2.out', onUpdate: () => { casesDirty = true; keycapsDirty = true; } });
          }
          hoverSwitchRing.position.set(cur.plateX, PLATE_Y + 0.10, cur.plateZ);
          hoverSwitchRing.material.color.setHex(meta.hex);
          hoverSwitchRing.visible = true;
          gsap.to(hoverSwitchRing.material, { opacity: 0.85, duration: 0.16 });
          writeArc(hoverArcGeo, cur);
          hoverArcLine.material.color.setHex(meta.hex);
          hoverArcLine.visible = true;
          gsap.to(hoverArcLine.material, { opacity: 0.48, duration: 0.18 });
        } else {
          hoverSwitchRing.visible = false; hoverArcLine.visible = false;
        }
      } else {
        document.body.style.cursor = orbit.isDragging ? 'grabbing' : 'default';
        gsap.to(hoverSwitchRing.material, { opacity: 0, duration: 0.16, onComplete: () => { if (!hoveredKey) hoverSwitchRing.visible = false; } });
        gsap.to(hoverArcLine.material, { opacity: 0, duration: 0.16, onComplete: () => { if (!hoveredKey) hoverArcLine.visible = false; } });
      }
    }

    const domEl = renderer.domElement;
    domEl.addEventListener('contextmenu', e => e.preventDefault());
    domEl.addEventListener('pointerdown', e => {
      orbit.isDragging = true; orbit.isPanning = e.button === 2 || e.button === 1 || e.shiftKey;
      orbit.lastX = e.clientX; orbit.lastY = e.clientY; orbit.movedDist = 0;
      domEl.setPointerCapture(e.pointerId);
    });
    domEl.addEventListener('pointermove', e => {
      updatePointerNDC(e.clientX, e.clientY);
      if (orbit.isDragging) {
        const dx = e.clientX - orbit.lastX, dy = e.clientY - orbit.lastY;
        orbit.lastX = e.clientX; orbit.lastY = e.clientY; orbit.movedDist += Math.hypot(dx, dy);
        if (orbit.movedDist > 4) {
          document.body.style.cursor = 'grabbing';
          if (orbit.isPanning) {
            const panScale = orbit.radius * 0.0014;
            const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
            const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
            orbit.target.addScaledVector(right, -dx * panScale).addScaledVector(up, dy * panScale);
            orbit.target.x = THREE.MathUtils.clamp(orbit.target.x, -22, 22);
            orbit.target.y = THREE.MathUtils.clamp(orbit.target.y, 0.5, 16);
            orbit.target.z = THREE.MathUtils.clamp(orbit.target.z, -16, 16);
          } else {
            orbit.theta -= dx * 0.0062;
            orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.0058, 0.20, Math.PI * 0.475);
          }
        }
      } else {
        setHoveredKey(pickKeyUnderPointer());
      }
    });
    domEl.addEventListener('pointerup', e => {
      const wasClick = orbit.isDragging && orbit.movedDist < 6 && e.button === 0;
      orbit.isDragging = false; orbit.isPanning = false;
      if (domEl.hasPointerCapture(e.pointerId)) domEl.releasePointerCapture(e.pointerId);
      if (wasClick) {
        updatePointerNDC(e.clientX, e.clientY);
        const clicked = pickKeyUnderPointer();
        if (clicked) {
          if (clicked.state === 'stored') installKey(clicked);
          else if (clicked.state === 'installed') pressInstalledKey(clicked);
        }
      }
      setHoveredKey(pickKeyUnderPointer());
    });
    domEl.addEventListener('wheel', e => {
      e.preventDefault();
      orbit.radius = THREE.MathUtils.clamp(orbit.radius * (1 + Math.sign(e.deltaY) * 0.075), 16, 92);
    }, { passive: false });
    domEl.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        orbit.isDragging = false;
        orbit.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
    }, { passive: true });
    domEl.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (orbit.pinchDist > 0) orbit.radius = THREE.MathUtils.clamp(orbit.radius * (orbit.pinchDist / d), 16, 92);
        orbit.pinchDist = d;
      }
    }, { passive: true });

    const preventCodes = new Set(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace','AltLeft','AltRight','ContextMenu','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12']);
    window.addEventListener('keydown', e => {
      if (e.repeat) return;
      const k = KEY_BY_CODE.get(e.code);
      if (!k) return;
      if (preventCodes.has(e.code)) e.preventDefault();
      if (e.code === 'Escape' && installedOrder.length > 0) { resetAllKeys(); return; }
      if (k.state === 'stored') installKey(k);
      else if (k.state === 'installed') pressInstalledKey(k);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 17. MAIN LOOP & STARTUP
    // =========================================================================
    updateHUD();
    renderGameRibbon();
    playIntroAnimation();

    let prevTime = 0;
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const dt = Math.min(0.05, elapsed - prevTime);
      prevTime = elapsed;

      motePoints.rotation.y = elapsed * 0.014;
      motePoints.position.y = Math.sin(elapsed * 0.4) * 0.35;
      if (hoverSwitchRing.visible) {
        const s = 1.0 + 0.10 * Math.sin(elapsed * 8);
        hoverSwitchRing.scale.set(s, 1, s);
      }

      updateGameplayVisuals(dt, elapsed);
      flushInstanceUpdates();
      updateSwitchLEDs(elapsed, dt);
      updateSparks(dt);
      updateCamera();

      renderer.render(scene, camera);
    }

    animate();
  })();
  </script>
</body>
</html>
